<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#1D9E75" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Parrillada" />
<link rel="manifest" href="manifest.json" />
<title>Parrillada 🔥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 1rem; }
  .wrap { width: 100%; max-width: 420px; }
  .header { text-align: center; padding: 2rem 0 1.2rem; margin-bottom: 1rem; }
  .fire { font-size: 40px; display: block; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; }
  .header p { font-size: 14px; color: #777; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 1.1rem 1.25rem; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .label { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
  .qty-row { display: flex; align-items: center; justify-content: center; }
  .qty-btn { width: 52px; height: 52px; border: none; background: #f0f0ea; color: #333; font-size: 26px; cursor: pointer; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: background 0.12s, transform 0.1s; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .qty-btn:active { transform: scale(0.93); background: #e0e0d8; }
  .qty-num { flex: 1; text-align: center; font-size: 44px; font-weight: 700; color: #1a1a1a; line-height: 1; }
  .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid #f0f0ea; }
  .price-label { font-size: 13px; color: #999; }
  .price-total { font-size: 26px; font-weight: 700; color: #1a1a1a; }
  .price-unit { font-size: 11px; color: #bbb; text-align: right; margin-top: 2px; }

  .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pay-opt { border: 2px solid #eee; border-radius: 12px; padding: 14px 6px; text-align: center; cursor: pointer; transition: border 0.15s, background 0.15s; background: white; -webkit-tap-highlight-color: transparent; user-select: none; }
  .pay-opt:active { transform: scale(0.96); }
  .pay-opt[data-pay="PLIN"].selected  { border: 2px solid #29b6d8; background: #d0f0fa; }
  .pay-opt[data-pay="YAPE"].selected  { border: 2px solid #9b59b6; background: #ead5f5; }
  .pay-opt[data-pay="EFECTIVO"].selected { border: 2px solid #27ae60; background: #c8f5d8; }
  .pay-icon { font-size: 26px; margin-bottom: 4px; }
  .pay-name { font-size: 13px; font-weight: 700; color: #1a1a1a; }

  /* Montos divididos */
  #montos-wrap { margin-top: 14px; display: none; gap: 8px; flex-direction: column; }
  #montos-wrap.visible { display: flex; }
  .monto-row { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 10px 12px; }
  .monto-row[data-for="PLIN"]     { background: #d0f0fa; }
  .monto-row[data-for="YAPE"]     { background: #ead5f5; }
  .monto-row[data-for="EFECTIVO"] { background: #c8f5d8; }
  .monto-label { font-size: 13px; font-weight: 700; color: #1a1a1a; min-width: 70px; }
  .monto-input { flex: 1; border: 1.5px solid #ddd; border-radius: 8px; padding: 8px 10px; font-size: 15px; font-weight: 600; background: white; color: #1a1a1a; outline: none; width: 100%; }
  .monto-input:focus { border-color: #1D9E75; }
  .monto-resta { font-size: 12px; color: #e53935; font-weight: 600; margin-left: 2px; min-width: 48px; text-align: right; }
  .monto-resta.ok { color: #1D9E75; }

  .btn-send { width: 100%; padding: 16px; background: #1D9E75; color: white; border: none; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 4px; letter-spacing: 0.2px; transition: background 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
  .btn-send:active { transform: scale(0.98); background: #0F6E56; }
  .btn-send:disabled { background: #ccc; cursor: not-allowed; }
  .toast { display: none; border-radius: 12px; padding: 13px 16px; margin-bottom: 12px; font-size: 14px; font-weight: 600; text-align: center; }
  .toast.show { display: block; }
  .toast.ok { background: #e6f9f2; color: #0F6E56; border: 1px solid #9FE1CB; }
  .toast.err { background: #fff0f0; color: #b91c1c; border: 1px solid #fca5a5; }
  #install-banner { display: none; background: #1D9E75; color: white; border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; align-items: center; justify-content: space-between; gap: 10px; }
  #install-banner p { font-size: 13px; font-weight: 600; flex: 1; }
  #install-banner .ibtn { background: white; color: #1D9E75; border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  #install-banner .xbtn { background: transparent; color: white; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="fire">🔥</span>
    <h1>Parrillada</h1>
    <p>Registra cada pedido aquí</p>
  </div>

  <div id="install-banner">
    <p>📲 Instalar como app</p>
    <button class="ibtn" id="install-btn">Instalar</button>
    <button class="xbtn" id="close-banner">✕</button>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Cantidad -->
  <div class="card">
    <div class="label">Cantidad de porciones</div>
    <div class="qty-row">
      <button class="qty-btn" id="minus">−</button>
      <div class="qty-num" id="qty-display">1</div>
      <button class="qty-btn" id="plus">+</button>
    </div>
    <div class="price-row">
      <div class="price-label">Total a cobrar</div>
      <div>
        <div class="price-total" id="total">S/ 20</div>
        <div class="price-unit">S/ 20 × <span id="qty-txt">1</span> porción</div>
      </div>
    </div>
  </div>

  <!-- Método de pago -->
  <div class="card">
    <div class="label">Método de pago</div>
    <div class="pay-grid">
      <div class="pay-opt" data-pay="PLIN" onclick="selectPay(this)">
        <div class="pay-icon">💙</div>
        <div class="pay-name">PLIN</div>
      </div>
      <div class="pay-opt" data-pay="YAPE" onclick="selectPay(this)">
        <div class="pay-icon">💜</div>
        <div class="pay-name">YAPE</div>
      </div>
      <div class="pay-opt" data-pay="EFECTIVO" onclick="selectPay(this)">
        <div class="pay-icon">💵</div>
        <div class="pay-name">Efectivo</div>
      </div>
    </div>

    <!-- Montos por método (aparece solo si hay 2+ seleccionados) -->
    <div id="montos-wrap"></div>
  </div>

  <button class="btn-send" id="btn-send" onclick="enviarPedido()">
    ✓ Registrar pedido
  </button>

</div>

<script>
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxmGzAi7kRJo_ec7KKUn4yQvCKVAixVvjTY0z4wD-apyfIx_ICgzyvImmmzP86K_2fq/exec';
  const PRECIO = 20;
  let qty = 1, ctx = null, deferredPrompt = null;
  let seleccionados = [];

  // PWA
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    document.getElementById('install-banner').style.display = 'flex';
  });
  document.getElementById('install-btn').onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  };
  document.getElementById('close-banner').onclick = () => {
    document.getElementById('install-banner').style.display = 'none';
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

  // Audio
  function getCtx() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function soundTick() {
    try { const c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='sine'; o.frequency.setValueAtTime(880,c.currentTime); o.frequency.exponentialRampToValueAtTime(660,c.currentTime+0.06); g.gain.setValueAtTime(0.15,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.09); o.start();o.stop(c.currentTime+0.09); } catch(e){}
  }
  function soundSelect() {
    try { const c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='triangle'; o.frequency.setValueAtTime(520,c.currentTime); o.frequency.exponentialRampToValueAtTime(780,c.currentTime+0.08); g.gain.setValueAtTime(0.18,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.13); o.start();o.stop(c.currentTime+0.13); } catch(e){}
  }
  function soundSuccess() {
    try {
      const c=getCtx();
      [523,659,1047].forEach((freq,i)=>{ const o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='sine'; const t=c.currentTime+i*0.14; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.25,t+0.04); g.gain.exponentialRampToValueAtTime(0.001,t+0.22); o.start(t);o.stop(t+0.22); });
      setTimeout(()=>{ try{ const c2=getCtx(),o2=c2.createOscillator(),g2=c2.createGain(); o2.connect(g2);g2.connect(c2.destination); o2.type='sine'; o2.frequency.setValueAtTime(1800,c2.currentTime); o2.frequency.exponentialRampToValueAtTime(1200,c2.currentTime+0.3); g2.gain.setValueAtTime(0.12,c2.currentTime); g2.gain.exponentialRampToValueAtTime(0.001,c2.currentTime+0.35); o2.start();o2.stop(c2.currentTime+0.35); }catch(e){} },430);
    } catch(e){}
  }
  function soundError() {
    try { const c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='sawtooth'; o.frequency.setValueAtTime(220,c.currentTime); o.frequency.exponentialRampToValueAtTime(110,c.currentTime+0.25); g.gain.setValueAtTime(0.15,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.28); o.start();o.stop(c.currentTime+0.28); } catch(e){}
  }

  document.getElementById('minus').onclick = () => { if (qty > 1) { qty--; soundTick(); update(); } };
  document.getElementById('plus').onclick  = () => { qty++; soundTick(); update(); };

  function update() {
    document.getElementById('qty-display').textContent = qty;
    document.getElementById('qty-txt').textContent = qty;
    document.getElementById('total').textContent = 'S/ ' + (PRECIO * qty);
    validarMontos();
  }

  function selectPay(el) {
    const pay = el.dataset.pay;
    if (el.classList.contains('selected')) {
      el.classList.remove('selected');
      seleccionados = seleccionados.filter(x => x !== pay);
    } else {
      el.classList.add('selected');
      seleccionados.push(pay);
    }
    soundSelect();
    renderMontos();
  }

  function renderMontos() {
    const wrap = document.getElementById('montos-wrap');
    wrap.innerHTML = '';
    if (seleccionados.length < 2) {
      wrap.classList.remove('visible');
      return;
    }
    wrap.classList.add('visible');
    seleccionados.forEach(pay => {
      const row = document.createElement('div');
      row.className = 'monto-row';
      row.dataset.for = pay;
      row.innerHTML = `
        <span class="monto-label">${pay}</span>
        <input class="monto-input" type="number" inputmode="numeric" placeholder="S/ 0" min="0" data-method="${pay}" oninput="validarMontos()" />
        <span class="monto-resta" id="resta-${pay}"></span>
      `;
      wrap.appendChild(row);
    });
    validarMontos();
  }

  function validarMontos() {
    const total = PRECIO * qty;
    const inputs = document.querySelectorAll('.monto-input');
    if (inputs.length < 2) return;
    let suma = 0;
    inputs.forEach(inp => { suma += parseFloat(inp.value) || 0; });
    const diff = total - suma;
    inputs.forEach(inp => {
      const pay = inp.dataset.method;
      const el = document.getElementById('resta-' + pay);
      if (el) {
        if (diff === 0) { el.textContent = '✓'; el.className = 'monto-resta ok'; }
        else { el.textContent = 'falta S/'+diff; el.className = 'monto-resta'; }
      }
    });
  }

  function showToast(msg, ok) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.className='toast show '+(ok?'ok':'err');
    setTimeout(()=>{ t.className='toast'; },4000);
  }

  async function enviarPedido() {
    if (seleccionados.length === 0) { soundError(); showToast('⚠️ Selecciona un método de pago', false); return; }

    const total = PRECIO * qty;
    let pagoStr = '';

    if (seleccionados.length === 1) {
      pagoStr = seleccionados[0];
    } else {
      // Validar que los montos sumen el total
      const inputs = document.querySelectorAll('.monto-input');
      let suma = 0;
      let partes = [];
      inputs.forEach(inp => {
        const val = parseFloat(inp.value) || 0;
        suma += val;
        partes.push(inp.dataset.method + ' S/' + val);
      });
      if (suma !== total) {
        soundError();
        showToast('⚠️ Los montos deben sumar S/' + total, false);
        return;
      }
      pagoStr = partes.join(' + ');
    }

    const btn = document.getElementById('btn-send');
    btn.disabled = true; btn.textContent = 'Enviando...';

    try {
      await fetch(SHEET_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cantidad: qty, pago: pagoStr, total: total })
      });
      soundSuccess();
      showToast('✅ ¡Pedido guardado correctamente!', true);
      qty = 1; seleccionados = [];
      update();
      document.querySelectorAll('.pay-opt').forEach(x => x.classList.remove('selected'));
      document.getElementById('montos-wrap').innerHTML = '';
      document.getElementById('montos-wrap').classList.remove('visible');
    } catch(e) {
      soundError(); showToast('❌ Error al guardar. Revisa tu conexión.', false);
    }

    btn.disabled = false; btn.textContent = '✓ Registrar pedido';
  }
</script>
</body>
</html>
