<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#7B4B2A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chocoteja" />
<link rel="manifest" href="manifest.json" />
<title>Chocoteja</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 1rem; }
  .wrap { width: 100%; max-width: 420px; }
  .header { text-align: center; padding: 1.2rem 0 1.2rem; margin-bottom: 1rem; }
  .fire { font-size: 40px; display: block; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; }
  .header p { font-size: 14px; color: #777; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 1.1rem 1.25rem; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .label { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }

  /* Sabores */
  .flavor { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0ea; }
  .flavor:last-of-type { border-bottom: none; }
  .flavor-info { flex: 1; min-width: 0; }
  .flavor-name { font-size: 15px; font-weight: 700; color: #1a1a1a; }
  .flavor-price { font-size: 12px; color: #999; margin-top: 2px; }
  .flavor.active .flavor-name { color: #7B4B2A; }
  .qty-btn { width: 44px; height: 44px; border: none; background: #f0f0ea; color: #333; font-size: 24px; cursor: pointer; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: background 0.12s, transform 0.1s; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .qty-btn:active { transform: scale(0.93); background: #e0e0d8; }
  .flavor.active .plus { background: #7B4B2A; color: white; }
  .qty-num { width: 34px; text-align: center; font-size: 24px; font-weight: 700; color: #1a1a1a; }
  .flavor:not(.active) .qty-num { color: #ccc; }

  .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 14px; border-top: 1px solid #f0f0ea; }
  .price-label { font-size: 13px; color: #999; }
  .price-total { font-size: 26px; font-weight: 700; color: #1a1a1a; text-align: right; }
  .price-unit { font-size: 12px; color: #999; text-align: right; margin-top: 2px; }
  .count-badge { display: inline-block; background: #7B4B2A; color: white; border-radius: 20px; padding: 2px 10px; font-size: 13px; font-weight: 700; }

  .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pay-opt { border: 2px solid #eee; border-radius: 12px; padding: 14px 6px; text-align: center; cursor: pointer; transition: border 0.15s, background 0.15s; background: white; -webkit-tap-highlight-color: transparent; user-select: none; }
  .pay-opt:active { transform: scale(0.96); }
  .pay-opt[data-pay="PLIN"].selected  { border: 2px solid #29b6d8; background: #d0f0fa; }
  .pay-opt[data-pay="YAPE"].selected  { border: 2px solid #9b59b6; background: #ead5f5; }
  .pay-opt[data-pay="EFECTIVO"].selected { border: 2px solid #27ae60; background: #c8f5d8; }
  .pay-icon { font-size: 26px; margin-bottom: 4px; }
  .pay-name { font-size: 13px; font-weight: 700; color: #1a1a1a; }

  /* Montos divididos */
  #montos-wrap { margin-top: 14px; display: none; gap: 8px; flex-direction: column; }
  #montos-wrap.visible { display: flex; }
  .monto-row { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 10px 12px; }
  .monto-row[data-for="PLIN"]     { background: #d0f0fa; }
  .monto-row[data-for="YAPE"]     { background: #ead5f5; }
  .monto-row[data-for="EFECTIVO"] { background: #c8f5d8; }
  .monto-label { font-size: 13px; font-weight: 700; color: #1a1a1a; min-width: 70px; }
  .monto-input { flex: 1; border: 1.5px solid #ddd; border-radius: 8px; padding: 8px 10px; font-size: 15px; font-weight: 600; background: white; color: #1a1a1a; outline: none; width: 100%; }
  .monto-input:focus { border-color: #7B4B2A; }
  .monto-resta { font-size: 12px; color: #e53935; font-weight: 600; margin-left: 2px; min-width: 64px; text-align: right; }
  .monto-resta.ok { color: #1D9E75; }

  .btn-send { width: 100%; padding: 16px; background: #7B4B2A; color: white; border: none; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 4px; letter-spacing: 0.2px; transition: background 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
  .btn-send:active { transform: scale(0.98); background: #5a3419; }
  .btn-send:disabled { background: #ccc; cursor: not-allowed; }
  .toast { display: none; border-radius: 12px; padding: 13px 16px; margin-bottom: 12px; font-size: 14px; font-weight: 600; text-align: center; }
  .toast.show { display: block; }
  .toast.ok { background: #e6f9f2; color: #0F6E56; border: 1px solid #9FE1CB; }
  .toast.err { background: #fff0f0; color: #b91c1c; border: 1px solid #fca5a5; }
  #install-banner { display: none; background: #7B4B2A; color: white; border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; align-items: center; justify-content: space-between; gap: 10px; }
  #install-banner p { font-size: 13px; font-weight: 600; flex: 1; }
  #install-banner .ibtn { background: white; color: #7B4B2A; border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  #install-banner .xbtn { background: transparent; color: white; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>Chocoteja</h1>
    <p>Registra cada pedido aquí</p>
  </div>

  <div id="install-banner">
    <p>📲 Instalar como app</p>
    <button class="ibtn" id="install-btn">Instalar</button>
    <button class="xbtn" id="close-banner">✕</button>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Sabores -->
  <div class="card">
    <div class="label">Sabores</div>
    <div id="flavors"></div>
    <div class="price-row">
      <div>
        <div class="price-label">Total a cobrar</div>
        <div class="price-unit" style="text-align:left;margin-top:6px"><span class="count-badge" id="count-badge">0</span> <span id="count-txt">chocotejas</span></div>
      </div>
      <div>
        <div class="price-total" id="total">S/ 0.00</div>
        <div class="price-unit" id="detalle">—</div>
      </div>
    </div>
  </div>

  <!-- Método de pago -->
  <div class="card">
    <div class="label">Método de pago</div>
    <div class="pay-grid">
      <div class="pay-opt" data-pay="PLIN" onclick="selectPay(this)">
        <div class="pay-icon">💙</div>
        <div class="pay-name">PLIN</div>
      </div>
      <div class="pay-opt" data-pay="YAPE" onclick="selectPay(this)">
        <div class="pay-icon">💜</div>
        <div class="pay-name">YAPE</div>
      </div>
      <div class="pay-opt" data-pay="EFECTIVO" onclick="selectPay(this)">
        <div class="pay-icon">💵</div>
        <div class="pay-name">Efectivo</div>
      </div>
    </div>

    <!-- Montos por método (aparece solo si hay 2+ seleccionados) -->
    <div id="montos-wrap"></div>
  </div>

  <button class="btn-send" id="btn-send" onclick="enviarPedido()">
    ✓ Registrar pedido
  </button>

</div>

<script>
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwf6eVtOyei-xAEYJchjmpstusSENTDVm93-HaWcX-55j_ZowEYQn0TlGzGSD0E30Jw/exec';

  // Precios en céntimos para evitar errores de decimales
  const SABORES = [
    { id: 'MARACUYA', nombre: 'Maracuyá', precio: 200 },
    { id: 'MANI',     nombre: 'Maní',     precio: 200 },
    { id: 'ARANDONA', nombre: 'Arándona', precio: 250 },
    { id: 'FRESA',    nombre: 'Fresa',    precio: 250 },
  ];

  let cant = {};
  SABORES.forEach(s => cant[s.id] = 0);
  let ctx = null, deferredPrompt = null;
  let seleccionados = [];

  const soles = c => 'S/ ' + (c / 100).toFixed(2);
  const totalCent = () => SABORES.reduce((a, s) => a + s.precio * cant[s.id], 0);
  const totalUnid = () => SABORES.reduce((a, s) => a + cant[s.id], 0);

  // PWA
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    document.getElementById('install-banner').style.display = 'flex';
  });
  document.getElementById('install-btn').onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  };
  document.getElementById('close-banner').onclick = () => {
    document.getElementById('install-banner').style.display = 'none';
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

  // Audio
  function getCtx() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function soundTick() {
    try { const c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='sine'; o.frequency.setValueAtTime(880,c.currentTime); o.frequency.exponentialRampToValueAtTime(660,c.currentTime+0.06); g.gain.setValueAtTime(0.15,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.09); o.start();o.stop(c.currentTime+0.09); } catch(e){}
  }
  function soundSelect() {
    try { const c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='triangle'; o.frequency.setValueAtTime(520,c.currentTime); o.frequency.exponentialRampToValueAtTime(780,c.currentTime+0.08); g.gain.setValueAtTime(0.18,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.13); o.start();o.stop(c.currentTime+0.13); } catch(e){}
  }
  function soundSuccess() {
    try {
      const c=getCtx();
      [523,659,1047].forEach((freq,i)=>{ const o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='sine'; const t=c.currentTime+i*0.14; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.25,t+0.04); g.gain.exponentialRampToValueAtTime(0.001,t+0.22); o.start(t);o.stop(t+0.22); });
      setTimeout(()=>{ try{ const c2=getCtx(),o2=c2.createOscillator(),g2=c2.createGain(); o2.connect(g2);g2.connect(c2.destination); o2.type='sine'; o2.frequency.setValueAtTime(1800,c2.currentTime); o2.frequency.exponentialRampToValueAtTime(1200,c2.currentTime+0.3); g2.gain.setValueAtTime(0.12,c2.currentTime); g2.gain.exponentialRampToValueAtTime(0.001,c2.currentTime+0.35); o2.start();o2.stop(c2.currentTime+0.35); }catch(e){} },430);
    } catch(e){}
  }
  function soundError() {
    try { const c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='sawtooth'; o.frequency.setValueAtTime(220,c.currentTime); o.frequency.exponentialRampToValueAtTime(110,c.currentTime+0.25); g.gain.setValueAtTime(0.15,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.28); o.start();o.stop(c.currentTime+0.28); } catch(e){}
  }

  // Render de sabores
  function renderSabores() {
    const box = document.getElementById('flavors');
    box.innerHTML = '';
    SABORES.forEach(s => {
      const row = document.createElement('div');
      row.className = 'flavor';
      row.id = 'fl-' + s.id;
      row.innerHTML = `
        <div class="flavor-info">
          <div class="flavor-name">${s.nombre}</div>
          <div class="flavor-price">${soles(s.precio)} c/u</div>
        </div>
        <button class="qty-btn minus" onclick="cambiar('${s.id}', -1)">−</button>
        <div class="qty-num" id="q-${s.id}">0</div>
        <button class="qty-btn plus" onclick="cambiar('${s.id}', 1)">+</button>
      `;
      box.appendChild(row);
    });
  }

  function cambiar(id, d) {
    const nuevo = cant[id] + d;
    if (nuevo < 0) return;
    cant[id] = nuevo;
    soundTick();
    update();
  }

  function update() {
    SABORES.forEach(s => {
      document.getElementById('q-' + s.id).textContent = cant[s.id];
      document.getElementById('fl-' + s.id).classList.toggle('active', cant[s.id] > 0);
    });
    const n = totalUnid();
    document.getElementById('count-badge').textContent = n;
    document.getElementById('count-txt').textContent = n === 1 ? 'chocoteja' : 'chocotejas';
    document.getElementById('total').textContent = soles(totalCent());
    const partes = SABORES.filter(s => cant[s.id] > 0).map(s => cant[s.id] + ' ' + s.nombre);
    document.getElementById('detalle').textContent = partes.length ? partes.join(' · ') : '—';
    validarMontos();
  }

  function selectPay(el) {
    const pay = el.dataset.pay;
    if (el.classList.contains('selected')) {
      el.classList.remove('selected');
      seleccionados = seleccionados.filter(x => x !== pay);
    } else {
      el.classList.add('selected');
      seleccionados.push(pay);
    }
    soundSelect();
    renderMontos();
  }

  function renderMontos() {
    const wrap = document.getElementById('montos-wrap');
    wrap.innerHTML = '';
    if (seleccionados.length < 2) {
      wrap.classList.remove('visible');
      return;
    }
    wrap.classList.add('visible');
    seleccionados.forEach(pay => {
      const row = document.createElement('div');
      row.className = 'monto-row';
      row.dataset.for = pay;
      row.innerHTML = `
        <span class="monto-label">${pay}</span>
        <input class="monto-input" type="number" inputmode="decimal" step="0.10" placeholder="S/ 0" min="0" data-method="${pay}" oninput="validarMontos()" />
        <span class="monto-resta" id="resta-${pay}"></span>
      `;
      wrap.appendChild(row);
    });
    validarMontos();
  }

  function sumaInputsCent() {
    let suma = 0;
    document.querySelectorAll('.monto-input').forEach(inp => {
      suma += Math.round((parseFloat(inp.value) || 0) * 100);
    });
    return suma;
  }

  function validarMontos() {
    const inputs = document.querySelectorAll('.monto-input');
    if (inputs.length < 2) return;
    const diff = totalCent() - sumaInputsCent();
    inputs.forEach(inp => {
      const el = document.getElementById('resta-' + inp.dataset.method);
      if (el) {
        if (diff === 0) { el.textContent = '✓'; el.className = 'monto-resta ok'; }
        else { el.textContent = 'falta ' + soles(diff); el.className = 'monto-resta'; }
      }
    });
  }

  function showToast(msg, ok) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.className='toast show '+(ok?'ok':'err');
    setTimeout(()=>{ t.className='toast'; },4000);
  }

  async function enviarPedido() {
    if (totalUnid() === 0) { soundError(); showToast('⚠️ Selecciona al menos un sabor', false); return; }
    if (seleccionados.length === 0) { soundError(); showToast('⚠️ Selecciona un método de pago', false); return; }

    const total = totalCent();
    let pagoStr = '';

    if (seleccionados.length === 1) {
      pagoStr = seleccionados[0];
    } else {
      const partes = [];
      document.querySelectorAll('.monto-input').forEach(inp => {
        const val = Math.round((parseFloat(inp.value) || 0) * 100);
        partes.push(inp.dataset.method + ' S/' + (val / 100).toFixed(2));
      });
      if (sumaInputsCent() !== total) {
        soundError();
        showToast('⚠️ Los montos deben sumar ' + soles(total), false);
        return;
      }
      pagoStr = partes.join(' + ');
    }

    const detalle = SABORES.filter(s => cant[s.id] > 0).map(s => cant[s.id] + ' ' + s.nombre).join(', ');

    const btn = document.getElementById('btn-send');
    btn.disabled = true; btn.textContent = 'Enviando...';

    try {
      await fetch(SHEET_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cantidad: totalUnid(),
          maracuya: cant.MARACUYA,
          mani: cant.MANI,
          arandona: cant.ARANDONA,
          fresa: cant.FRESA,
          detalle: detalle,
          pago: pagoStr,
          total: total / 100
        })
      });
      soundSuccess();
      showToast('✅ ¡Pedido guardado correctamente!', true);
      SABORES.forEach(s => cant[s.id] = 0);
      seleccionados = [];
      update();
      document.querySelectorAll('.pay-opt').forEach(x => x.classList.remove('selected'));
      document.getElementById('montos-wrap').innerHTML = '';
      document.getElementById('montos-wrap').classList.remove('visible');
    } catch(e) {
      soundError(); showToast('❌ Error al guardar. Revisa tu conexión.', false);
    }

    btn.disabled = false; btn.textContent = '✓ Registrar pedido';
  }

  renderSabores();
  update();
</script>
</body>
</html>
